<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<title>小冷 · 个人 AI 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=61">
</head>
<body>

<div class="app">

  <!-- ===== 桌面端侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M5 3 L19 3 L12 12 Z" fill="#1A1A1A"/><path d="M5 21 L19 21 L12 12 Z" fill="#1A1A1A"/></svg>
      </span>
      <span class="sidebar-title">小冷<span class="dot">.</span></span>
    </div>
    <div class="sidebar-profile" id="sidebarProfile">
      <div class="avatar">冷</div>
      <div class="profile-info">
        <div class="profile-name">小冷</div>
        <div class="profile-desc">杭州 · AI 自媒体</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="auth-area" id="authArea"></div>
      <div class="help-center-card" id="sidebarHelpCenter">
        <div class="help-center-icon">?</div>
        <div class="help-center-text">
          <div class="help-center-title">帮助中心</div>
          <div class="help-center-desc">有问题？点我查看说明</div>
        </div>
      </div>
      <div class="sidebar-version-row">
        <span class="sidebar-version" id="sidebarVersion">v3.3.27 · 扭蛋机改造</span>
        <div class="sound-wave">
          <span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== 主内容区 ===== -->
  <main class="main-content" id="mainContent">
    <header class="topbar" id="topbar">
      <button class="topbar-back" id="topbarBack">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="topbar-title" id="topbarTitle">今日</h1>
      <div class="topbar-tabs">
        <div class="topbar-tab active">工作台</div>
      </div>
      <div class="topbar-search" id="topbarSearch">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="搜索选题、内容、素材..." id="topbarSearchInput" readonly>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="searchBtn" title="搜索">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn" id="topbarHelpBtn" title="帮助">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <button class="topbar-add-btn" id="topbarAddBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>新建</span>
        </button>
        <button class="icon-btn" id="refreshBtn" title="刷新数据" style="display:none;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </div>
    </header>
    <div class="page-container" id="pageContainer"></div>
  </main>

</div>

<!-- ===== 移动端底部导航 ===== -->
<nav class="bottom-nav" id="bottomNav"></nav>

<!-- ===== 浮动工具栏（桌面端） ===== -->
<div class="floating-toolbar" id="floatingToolbar"></div>

<!-- ===== 搜索浮层 ===== -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-panel">
    <div class="search-header">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索所有内容..." autocomplete="off">
      <button class="search-close" id="searchClose">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<!-- ===== 帮助浮层 ===== -->
<div class="help-overlay" id="helpOverlay">
  <div class="help-panel" id="helpPanel"></div>
</div>

<!-- ===== 通用模态框 ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-container" id="modalContainer"></div>
</div>

<!-- ===== 快捷添加浮层 ===== -->
<div class="fab-overlay" id="fabOverlay">
  <div class="fab-panel">
    <div class="fab-header">
      <span>快速添加</span>
      <button class="fab-close" id="fabClose">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="fab-list" id="fabList"></div>
  </div>
</div>

<!-- ===== Toast 提示 ===== -->
<div class="toast" id="toast"></div>

<!-- ===== AI 悬浮助手 ===== -->
<button class="ai-fab-button" id="aiFabButton" aria-label="打开 AI 助手">
  <svg class="ai-fab-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="fabFace" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#EAF2FF"/>
      </linearGradient>
      <linearGradient id="fabBlue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5B8FF9"/>
        <stop offset="100%" stop-color="#2E6BFF"/>
      </linearGradient>
    </defs>
    <rect x="18" y="40" width="164" height="120" rx="52" fill="url(#fabBlue)"/>
    <rect x="34" y="56" width="132" height="88" rx="40" fill="url(#fabFace)"/>
    <circle cx="74" cy="94" r="13" fill="#1A1A1A"/>
    <circle cx="78" cy="90" r="4.5" fill="#FFFFFF"/>
    <circle cx="126" cy="94" r="13" fill="#1A1A1A"/>
    <circle cx="130" cy="90" r="4.5" fill="#FFFFFF"/>
    <path d="M92 118 Q100 126 108 118" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <rect x="86" y="24" width="28" height="24" rx="6" fill="#5B8FF9"/>
    <circle cx="100" cy="20" r="8" fill="#2E6BFF"/>
    <rect x="24" y="80" width="12" height="32" rx="6" fill="#5B8FF9"/>
    <rect x="164" y="80" width="12" height="32" rx="6" fill="#5B8FF9"/>
  </svg>
</button>

<!-- ===== AI 悬浮弹窗 ===== -->
<div class="ai-fab-overlay" id="aiFabOverlay">
  <div class="ai-fab-panel" id="aiFabPanel">
    <div class="ai-fab-header">
      <div class="ai-fab-header-info">
        <div class="ai-fab-header-avatar">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="fabMiniFace" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#EAF2FF"/>
              </linearGradient>
              <linearGradient id="fabMiniBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5B8FF9"/>
                <stop offset="100%" stop-color="#2E6BFF"/>
              </linearGradient>
            </defs>
            <rect x="18" y="40" width="164" height="120" rx="52" fill="url(#fabMiniBlue)"/>
            <rect x="34" y="56" width="132" height="88" rx="40" fill="url(#fabMiniFace)"/>
            <circle cx="74" cy="94" r="13" fill="#1A1A1A"/>
            <circle cx="78" cy="90" r="4.5" fill="#FFFFFF"/>
            <circle cx="126" cy="94" r="13" fill="#1A1A1A"/>
            <circle cx="130" cy="90" r="4.5" fill="#FFFFFF"/>
            <path d="M92 118 Q100 126 108 118" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
            <rect x="86" y="24" width="28" height="24" rx="6" fill="#5B8FF9"/>
            <circle cx="100" cy="20" r="8" fill="#2E6BFF"/>
          </svg>
        </div>
        <div class="ai-fab-header-text">
          <div class="ai-fab-header-title">AI 小猫助手</div>
          <div class="ai-fab-header-status" id="aiFabHeaderStatus">在线</div>
        </div>
      </div>
      <button class="ai-fab-close" id="aiFabClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="ai-fab-body" id="aiFabBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=61"></script>
<script src="js/supabase-client.js?v=61"></script>
<script src="js/auth.js?v=61"></script>
<script src="js/store.js?v=61"></script>
<script src="js/api.js?v=61"></script>
<script src="js/icons.js?v=61"></script>
<script src="js/modules.js?v=61"></script>
<script src="js/habits.js?v=61"></script>
<script src="js/app.js?v=61"></script>
</body>
</html>
